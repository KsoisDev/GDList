    <script>
      (() => {
        try {
          const redirect = sessionStorage.getItem('gdlist.redirect') || sessionStorage.getItem('redirect')
          sessionStorage.removeItem('gdlist.redirect')
          sessionStorage.removeItem('redirect')
          if (!redirect) return

          const base = '%BASE_URL%'
          if (base === '/') return

          const target = new URL(redirect)
          const basePath = base.endsWith('/') ? base.slice(0, -1) : base
          const isAppPath = target.pathname === basePath || target.pathname.startsWith(`${basePath}/`)
          if (target.origin === location.origin && isAppPath) {
            history.replaceState(null, '', `${target.pathname}${target.search}${target.hash}`)
          }
        } catch {
          // Continue at the app root if storage or URL parsing is unavailable.
        }
      })()
    </script>
