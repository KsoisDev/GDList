<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Basement List</title>
  <script>
    const appRoot = '/GDList/'
    try {
      sessionStorage.setItem('gdlist.redirect', location.href)
    } catch {
      // The redirect still reaches the app root when storage is unavailable.
    }
    // A timestamp prevents a just-deployed site from reusing a stale index file.
    location.replace(`${appRoot}?redirect=${Date.now()}`)
  </script>
  <noscript><meta http-equiv="refresh" content="0;URL='/GDList/'"></noscript>
</head>
<body></body>
</html>
