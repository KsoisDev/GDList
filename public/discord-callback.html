<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Discord Login</title>
  <script>
    (function () {
      var hash = location.hash.substring(1)
      if (hash) {
        // Resolve the app origin from this file's own location so the redirect
        // works on every host (Netlify, GitHub Pages, preview URLs, localhost).
        var base = location.origin
        location.replace(base + '/profile?discord_token=' + encodeURIComponent(hash))
      } else {
        document.body.textContent = 'No token received. You can close this tab.'
      }
    })()
  </script>
</head>
<body></body>
</html>
