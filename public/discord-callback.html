<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Discord Login</title>
  <script>
    (function () {
      var hash = location.hash.substring(1)
      if (hash) {
        var isProd = location.hostname === 'blist.ksois.com'
        var base = isProd ? 'https://blist.ksois.com' : 'http://localhost:4173'
        location.replace(base + '/profile?discord_token=' + encodeURIComponent(hash))
      } else {
        document.body.textContent = 'No token received. You can close this tab.'
      }
    })()
  </script>
</head>
<body></body>
</html>
